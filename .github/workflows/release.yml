name: Release
# On a v* tag: build the signed release APK and attach it to a GitHub release.
# Obtainium installs from these releases; F-Droid publishes the same APK once its
# own rebuild matches it (see RELEASING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - run: ./gradlew testDebugUnitTest assembleRelease
      - name: Name the APK after the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "yaft-$version.apk"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          notes="fastlane/metadata/android/en-US/changelogs/$code.txt"
          gh release create "$GITHUB_REF_NAME" "yaft-$VERSION.apk" --title "yaft $VERSION" --notes-file "$notes"
      - if: always()
        run: rm -f release.jks keystore.properties
